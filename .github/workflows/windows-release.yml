name: Instalação Windows e primeiro arranque
on:
  push:
    branches: [main, codex/agent-improvements]
    paths:
      - src/**
      - ui/**
      - config/**
      - package.json
      - package-lock.json
      - .github/workflows/windows-release.yml
      - scripts/test-installed-windows.ps1
      - scripts/test-update-windows.ps1
      - tests/windows-update.mjs
      - tests/native-updater.mjs
      - tests/fixtures/updater-fixture.cpp
      - native/updater.cpp
      - scripts/test-without-webview.ps1
      - tests/windows-installed.mjs
      - src-tauri/tauri.conf.json
      - scripts/build-desktop.ps1
      - scripts/prepare-build-directory.ps1
      - scripts/build-native.ps1
      - native/hardware.cpp
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Versão pública a testar
        required: true
        default: v1.0.6
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        webview: [present, absent]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXO_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Compilar distribuição em máquina nova
        if: github.event_name != 'release'
        shell: pwsh
        run: |
          ./scripts/build-desktop.ps1
          $testRoot = Join-Path $env:RUNNER_TEMP 'nexo-release-validation'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $setup = Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          Copy-Item -LiteralPath $setup.FullName -Destination (Join-Path $testRoot 'setup.exe')
      - name: Verificar assinatura e obter instalador
        if: github.event_name == 'release'
        run: node --use-system-ca scripts/fetch-release-test.mjs
      - name: Preparar Windows sem WebView2
        if: matrix.webview == 'absent'
        shell: pwsh
        run: |
          ./scripts/test-without-webview.ps1
          'NEXO_EXPECT_WEBVIEW_ABSENT=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Instalar e validar primeiro arranque
        shell: pwsh
        run: ./scripts/test-installed-windows.ps1
      - name: Atualizar, falhar e recuperar sem perder dados
        if: matrix.webview == 'present' && github.event_name != 'release'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/test-update-windows.ps1
      - name: Guardar resultados e capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installation-results-${{ matrix.webview }}
          path: ${{ runner.temp }}/nexo-release-validation/*.json
      - name: Guardar diagnóstico do ambiente de teste
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installation-diagnostics-${{ matrix.webview }}
          path: ${{ runner.temp }}/nexo-release-validation/*.txt
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installation-screenshots-${{ matrix.webview }}
          path: ${{ runner.temp }}/nexo-release-validation/*.png
